services:
  plataforma-cursos:
    image: ghcr.io/alanisoliveira/plataform-course2:latest
    container_name: plataforma-cursos
    restart: unless-stopped
    ports:
      - "9823:9823"
    volumes:
      # Volumes persistentes - NUNCA serão perdidos
      - plataforma-cursos-data:/app/data
      - plataforma-cursos-uploads:/app/uploads

      # Backups salvos diretamente no ZimaOS (acessível via SMB/NFS)
      - /ZimaOS-HD/AppData/plataforma-cursos/backups:/app/backups

      # Volume de cursos - ajuste o caminho conforme seu ZimaOS
      - /media/Novo volume-2/Cursos:/Cursos:ro
    environment:
      - DATABASE_URL=sqlite:////app/data/platform_course.sqlite
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9823/api/debug/routes"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Volumes nomeados - estes volumes são persistentes
# e NÃO serão perdidos quando o container for recriado
volumes:
  plataforma-cursos-data:
    name: plataforma-cursos-data
    driver: local
  plataforma-cursos-uploads:
    name: plataforma-cursos-uploads
    driver: local
# Backups agora são salvos diretamente no host em /ZimaOS-HD/AppData/plataforma-cursos/backups
