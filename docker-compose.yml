version: "3.8"

services:
  plataforma-cursos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plataforma-cursos
    restart: unless-stopped
    ports:
      - "${PORT:-9823}:9823"
    volumes:
      # Named volumes para persistência garantida no ZimaOS
      - plataforma-data:/app/data
      - plataforma-uploads:/app/uploads

      # Volume de cursos - configurado via variável de ambiente
      # Configure COURSES_PATH no arquivo .env
      - ${COURSES_PATH}:${COURSES_INTERNAL_PATH:-/cursos}:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/platform_course.sqlite}
      - FLASK_ENV=${FLASK_ENV:-production}
      - PYTHONUNBUFFERED=1
    networks:
      - plataforma-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9823/api/debug/routes"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-plataforma
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=false
    command: plataforma-cursos
    networks:
      - plataforma-network

volumes:
  plataforma-data:
    driver: local
  plataforma-uploads:
    driver: local

networks:
  plataforma-network:
    driver: bridge
