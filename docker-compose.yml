services:
  plataforma-cursos:
    image: ${APP_IMAGE:-ghcr.io/alanisoliveira/plataform-course2:latest}
    container_name: plataforma-cursos
    restart: unless-stopped
    ports:
      - "${PORT:-9823}:9823"
    volumes:
      - plataforma-cursos-uploads:/app/uploads
      - plataforma-cursos-backups:/app/backups
      - ${COURSES_PATH}:${COURSES_INTERNAL_PATH:-/cursos}:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - FLASK_ENV=${FLASK_ENV:-production}
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_DEFAULT_NAME=${ADMIN_DEFAULT_NAME:-Admin}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - UPLOAD_FOLDER=/app/uploads
      - BACKUP_DIR=/app/backups
      - COURSES_INTERNAL_PATH=${COURSES_INTERNAL_PATH:-/cursos}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
    networks:
      - plataforma-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9823/api/debug/routes"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Volumes nomeados com prefixo fixo
# NUNCA renomeie estes volumes!
volumes:
  plataforma-cursos-uploads:
    name: plataforma-cursos-uploads
    driver: local
  plataforma-cursos-backups:
    name: plataforma-cursos-backups
    driver: local

networks:
  plataforma-network:
    driver: bridge
