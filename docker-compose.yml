version: "3.8"

services:
  plataforma-cursos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plataforma-cursos
    restart: unless-stopped
    ports:
      - "${PORT:-9823}:9823"
    volumes:
      # Volumes nomeados FIXOS - NUNCA serão perdidos mesmo com rebuild
      - plataforma-cursos-data:/app/data
      - plataforma-cursos-uploads:/app/uploads
      - plataforma-cursos-backups:/app/backups

      # Volume de cursos - configurado via variável de ambiente
      # Configure COURSES_PATH no arquivo .env
      - ${COURSES_PATH}:${COURSES_INTERNAL_PATH:-/cursos}:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/platform_course.sqlite}
      - FLASK_ENV=${FLASK_ENV:-production}
      - PYTHONUNBUFFERED=1
    networks:
      - plataforma-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9823/api/debug/routes"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Interface web para gerenciar o banco SQLite
  adminer:
    image: adminer:latest
    container_name: plataforma-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Acesso ao volume do banco de dados
      - plataforma-cursos-data:/data:ro
    environment:
      - ADMINER_DEFAULT_SERVER=sqlite
    networks:
      - plataforma-network

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-plataforma
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=false
    command: plataforma-cursos
    networks:
      - plataforma-network

# Volumes nomeados com prefixo fixo
# NUNCA renomeie estes volumes!
volumes:
  plataforma-cursos-data:
    name: plataforma-cursos-data
    driver: local
  plataforma-cursos-uploads:
    name: plataforma-cursos-uploads
    driver: local
  plataforma-cursos-backups:
    name: plataforma-cursos-backups
    driver: local

networks:
  plataforma-network:
    driver: bridge
